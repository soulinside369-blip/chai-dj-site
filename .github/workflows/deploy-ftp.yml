name: Выкладка на хостинг (FTP)
# Включается, когда в Settings → Secrets заданы FTP_USERNAME, FTP_PASSWORD и переменная SITE_URL.
# Хостинг reg.ru: server109.hosting.reg.ru, папка сайта www/xn--80adjrs4a9a5b.xn--p1ai/ (эвентчай.рф).
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:calc
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: /
      - run: npx playwright install --with-deps chromium
      - run: npm run pdf
        env:
          BASE_PATH: /
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'server109.hosting.reg.ru' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'www/xn--80adjrs4a9a5b.xn--p1ai/' }}
          exclude: |
            **/api/config.php
            **/api/private/**
