name: Выкладка на хостинг (FTP)
# Включается переменной SITE_URL. Секреты: FTP_PASSWORD (обязательно), ADMIN_PASSWORD, TG_BOT_TOKEN, AMO_TOKEN; переменные: LEAD_EMAIL, METRIKA_ID, TG_CHAT_ID, AMO_DOMAIN.
# Хостинг reg.ru: server109.hosting.reg.ru, папка сайта www/xn--80adjrs4a9a5b.xn--p1ai/ (эвентчай.рф).
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:calc
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: /
          METRIKA_ID: ${{ vars.METRIKA_ID }}
      # Настройки приёма заявок собираем из секретов GitHub: на сервер попадает только хеш пароля панели
      - name: Настройки сервера (api/config.php)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          LEAD_EMAIL: ${{ vars.LEAD_EMAIL }}
          AMO_DOMAIN: ${{ vars.AMO_DOMAIN }}
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: php scripts/make-config.php > dist/api/config.php
      - run: npx playwright install --with-deps chromium
      - run: npm run pdf
        env:
          BASE_PATH: /
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'server109.hosting.reg.ru' }}
          username: ${{ secrets.FTP_USERNAME || 'u3723546' }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'www/xn--80adjrs4a9a5b.xn--p1ai/' }}
          exclude: |
            **/api/private/**
            **/api/config.example.php
